<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kathryn's Learner Driver Toolkit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="icon.png">
 <style> 
    /* ===== PROFESSIONAL APPEARANCE UPDATE ===== */

    body {
      background:
        linear-gradient(180deg, #0f172a 0%, #172554 100%);
      min-height: 100vh;
    }

    header {
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
    }

    header h1 {
      color: #0f172a;
      letter-spacing: -1px;
    }

    header p {
      line-height: 1.5;
    }

    .category-card,
    .topic-button,
    .back-button,
    .resource-link {
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }

    .category-card:hover,
    .topic-button:hover,
    .back-button:hover,
    .resource-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .category-card:active,
    .topic-button:active,
    .back-button:active,
    .resource-link:active {
      transform: translateY(0);
    }

    .category-card {
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .topic-button {
      box-shadow: 0 7px 18px rgba(37, 99, 235, 0.22);
    }

    .topic-button.empty {
      opacity: 0.82;
      box-shadow: none;
    }

    .page-panel {
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.2);
    }

    .page-heading {
      padding-bottom: 14px;
      border-bottom: 2px solid #e2e8f0;
      color: #0f172a;
    }

    .video-card {
      border: 1px solid #dbe3ee;
      background: white;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
    }

    .video-card h2 {
      color: #1e293b;
      line-height: 1.3;
    }

    .video {
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.22);
    }

    .resource-link {
      border: none;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    /* Red buttons for PDF files */
    .resource-link[href$=".pdf"] {
      background: #dc2626;
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.25);
    }

    .resource-link[href$=".pdf"]:hover {
      background: #b91c1c;
    }

    /* Blue buttons for Word documents */
    .resource-link[href$=".docx"],
    .resource-link[href$=".doc"] {
      background: #2563eb;
    }

    footer {
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 16px;
      }

      header h1 {
        font-size: 32px;
      }

      .page-panel {
        padding: 17px;
      }

      .page-heading {
        font-size: 28px;
      }

      .video-card {
        padding: 16px;
      }

      .video-card h2 {
        font-size: 21px;
      }

      .resource-link {
        padding: 15px;
        font-size: 17px;
      }
    }

    /* ===== CATEGORY CARD ICON LAYOUT ===== */
    .category-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    .category-card .category-icon {
      display: block;
      line-height: 1;
    }

    .category-card .category-icon i {
      font-size: 42px;
    }

    .category-card .category-name {
      display: block;
      line-height: 1.2;
    }

    @media (max-width: 600px) {
      .category-card .category-icon i {
        font-size: 36px;
      }
    }


    /* ===== NUMBER 3: SPACING, CORNERS & SHADOWS ===== */

    .category-grid {
      gap: 20px;
    }

    .category-card {
      min-height: 145px;
      padding: 26px 22px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }

    .category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.22);
    }

    .category-card:active {
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.16);
    }

    .category-card .category-icon {
      margin-bottom: 2px;
    }

    .category-card .category-name {
      max-width: 220px;
      line-height: 1.18;
    }

    @media (max-width: 600px) {
      .category-grid {
        gap: 14px;
      }

      .category-card {
        min-height: 116px;
        padding: 22px 18px;
        border-radius: 16px;
      }
    }


    /* ===== NUMBER 4: PROFESSIONAL APP HEADER ===== */

    header {
      position: relative;
      overflow: hidden;
      padding: 30px 24px 26px;
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    header::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 72px;
      height: 4px;
      border-radius: 999px;
      background: #2563eb;
      transform: translateX(-50%);
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 30px;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
    }

    header h1 {
      margin-bottom: 10px;
      font-size: 40px;
      line-height: 1.08;
      letter-spacing: -0.8px;
    }

    header p {
      max-width: 620px;
      margin: 0 auto;
      color: #64748b;
      font-size: 17px;
      line-height: 1.55;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 18px 22px;
        border-radius: 18px;
      }

      .brand-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 12px;
        border-radius: 16px;
        font-size: 27px;
      }

      header h1 {
        font-size: 31px;
      }

      header p {
        font-size: 16px;
      }
    }

    /* ===== END APPEARANCE UPDATE ===== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #0f172a;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      margin-bottom: 18px;
      padding: 24px;
      border-radius: 22px;
      background: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }

    header p {
      margin: 0;
      color: #64748b;
      font-size: 18px;
    }

    .category-grid,
    .topic-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }

    .category-card {
      min-height: 130px;
      padding: 22px;
      border: none;
      border-radius: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
    }

    /* Professional five-colour category palette */
    .category-card:nth-child(5n + 1) {
      background: #2563eb;
    }

    .category-card:nth-child(5n + 2) {
      background: #0f766e;
    }

    .category-card:nth-child(5n + 3) {
      background: #b45309;
    }

    .category-card:nth-child(5n + 4) {
      background: #6d28d9;
    }

    .category-card:nth-child(5n + 5) {
      background: #475569;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .page-panel {
      padding: 22px;
      border-radius: 22px;
      background: white;
    }

    .page-heading {
      margin: 0 0 18px;
      font-size: 34px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 18px;
      padding: 13px 18px;
      border: none;
      border-radius: 11px;
      background: #475569;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .topic-button {
      min-height: 84px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .topic-button.empty {
      background: #64748b;
    }

    .video-card {
      margin-bottom: 22px;
      padding: 20px;
      border-radius: 18px;
      background: #f1f5f9;
    }

    .video-card h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .video {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: black;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .resource-link {
      display: inline-block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .resource-link:hover {
      background: #1d4ed8;
    }

    .empty-message {
      padding: 25px;
      border-radius: 16px;
      background: #f1f5f9;
      color: #64748b;
      text-align: center;
      font-size: 19px;
    }

    footer {
      margin-top: 18px;
      padding: 17px;
      border-radius: 18px;
      background: white;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 11px;
      }

      header h1 {
        font-size: 34px;
      }

      .category-grid,
      .topic-grid {
        grid-template-columns: 1fr;
      }

      .category-card {
        min-height: 100px;
      }
    }

    /* ===== NUMBER 5 FINAL OVERRIDES ===== */

    /* Keep the subtitle centred on desktop and mobile */
    header p {
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
      text-align: center !important;
    }

    /* More polished subject/topic cards */
    .topic-grid {
      gap: 18px;
    }

    .topic-button {
      position: relative;
      min-height: 90px;
      padding: 20px 54px 20px 22px;
      border-radius: 14px;
      text-align: left;
      background: #2563eb;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.20);
    }

    .topic-button::after {
      content: "\f054";
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 17px;
      opacity: 0.9;
    }

    .topic-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.25);
    }

    .topic-button.empty {
      background: #64748b;
      opacity: 0.82;
      box-shadow: none;
    }

    .topic-button.empty::after {
      content: "\f068";
      opacity: 0.55;
    }

    @media (max-width: 600px) {
      .topic-grid {
        gap: 12px;
      }

      .topic-button {
        min-height: 78px;
        padding: 17px 48px 17px 18px;
        font-size: 19px;
      }

      .topic-button::after {
        right: 17px;
      }
    }


    /* ===== NUMBER 6: TYPOGRAPHY + RESOURCE CARD REDESIGN ===== */

    body,
    .category-card,
    .topic-button,
    .back-button,
    .resource-link {
      font-family: "Inter", Arial, sans-serif;
    }

    .video-card {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 7px 20px rgba(15, 23, 42, 0.09);
    }

    .video-card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      color: #0f172a;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
    }

    .resource-title-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 16px;
    }

    .resource-title-icon.pdf {
      background: #fef2f2;
      color: #dc2626;
    }

    .resource-title-icon.doc {
      background: #eff6ff;
      color: #2563eb;
    }

    .resource-title-icon.image {
      background: #f0fdfa;
      color: #0f766e;
    }

    .resource-title-icon.link {
      background: #f5f3ff;
      color: #6d28d9;
    }

    .resource-title-icon.video-icon {
      background: #fff7ed;
      color: #b45309;
    }

    .video {
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.16);
    }

    .resource-link {
      margin-top: 2px;
      border-radius: 11px;
      font-weight: 700;
    }

    .resource-image {
      width: 100%;
      max-width: 800px;
      display: block;
      margin: 0 auto;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.10);
    }

    .website-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 18px;
      border-radius: 12px;
      background: #6d28d9;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(109, 40, 217, 0.20);
    }

    .website-link:hover {
      filter: brightness(1.06);
    }

    @media (max-width: 600px) {
      .video-card {
        padding: 15px;
        border-radius: 16px;
      }

      .video-card h2 {
        gap: 9px;
        font-size: 19px;
      }

      .resource-title-icon {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        font-size: 14px;
      }
    }


    /* ===== FINAL INTERFACE UPDATE: NAVIGATION + CATEGORY HEADINGS ===== */

    .navigation-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .navigation-row .back-button {
      margin-bottom: 0;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 18px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-family: "Inter", Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(37, 99, 235, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .home-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
    }

    .category-heading-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }

    .category-heading-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 23px;
    }

    .category-heading-wrap .page-heading {
      margin: 0;
      padding: 0;
      border: 0;
    }

    @media (max-width: 600px) {
      .navigation-row {
        gap: 8px;
        margin-bottom: 14px;
      }

      .navigation-row .back-button,
      .home-button {
        padding: 11px 14px;
        font-size: 15px;
      }

      .category-heading-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        font-size: 20px;
      }

      .category-heading-wrap {
        gap: 11px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <section
      id="home-screen"
      class="screen active"
    >

      <header>
        <div class="brand-icon" aria-hidden="true">
          <i class="fa-solid fa-car-side"></i>
        </div>

        <h1>Dave's Learner Driver Toolkit</h1>

        <p>
          Videos, guides and resources to support your driving lessons.
        </p>
      </header>

      <main
        id="category-grid"
        class="category-grid"
      ></main>

      <footer>
        Choose a category to see its subjects.
      </footer>

    </section>


    <section
      id="category-screen"
      class="screen"
    >

      <div class="navigation-row">
        <button
          class="back-button"
          onclick="showHome()"
        >
          ← Back
        </button>

        <button
          class="home-button"
          onclick="showHome()"
        >
          <i class="fa-solid fa-house"></i> Home
        </button>
      </div>

      <div class="page-panel">

        <div class="category-heading-wrap">
          <span id="category-heading-icon" class="category-heading-icon"></span>
          <h1
            id="category-heading"
            class="page-heading"
          ></h1>
        </div>

        <div
          id="topic-grid"
          class="topic-grid"
        ></div>

      </div>

    </section>


    <section
      id="topic-screen"
      class="screen"
    >

      <div class="navigation-row">
        <button
          class="back-button"
          onclick="showCurrentCategory()"
        >
          ← Back to subjects
        </button>

        <button
          class="home-button"
          onclick="showHome()"
        >
          <i class="fa-solid fa-house"></i> Home
        </button>
      </div>

      <div class="page-panel">

        <h1
          id="topic-heading"
          class="page-heading"
        ></h1>

        <div id="video-list"></div>

      </div>

    </section>

  </div>


  <script src="videos.js?v=3"></script>

  <script>
    let currentCategoryIndex = 0;

    function hideAllScreens() {
      document
        .querySelectorAll(".screen")
        .forEach(function (screen) {
          screen.classList.remove("active");
        });
    }

    function showHome() {
      hideAllScreens();

      document
        .getElementById("home-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function showCategory(categoryIndex) {
      currentCategoryIndex = categoryIndex;

      const category = toolkitData[categoryIndex];

      document.getElementById("category-heading").textContent =
        category.name;

      document.getElementById("category-heading-icon").innerHTML =
        category.icon;

      const topicGrid =
        document.getElementById("topic-grid");

      topicGrid.innerHTML = "";

      category.topics.forEach(function (topic, topicIndex) {
        const button = document.createElement("button");

        button.className = "topic-button";

        if (!topic.videos || topic.videos.length === 0) {
          button.classList.add("empty");
        }

        button.textContent = topic.name;

        button.onclick = function () {
          showTopic(categoryIndex, topicIndex);
        };

        topicGrid.appendChild(button);
      });

      hideAllScreens();

      document
        .getElementById("category-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function showCurrentCategory() {
      showCategory(currentCategoryIndex);
    }

    function showTopic(categoryIndex, topicIndex) {
      currentCategoryIndex = categoryIndex;

      const topic =
        toolkitData[categoryIndex].topics[topicIndex];

      document.getElementById(
        "topic-heading"
      ).textContent = topic.name;

      const videoList =
        document.getElementById("video-list");

      videoList.innerHTML = "";

      if (!topic.videos || topic.videos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            No videos or resources have been added yet.
          </div>
        `;
      } else {
        topic.videos.forEach(function (resource) {
          const card = document.createElement("div");

          card.className = "video-card";

          if (resource.type === "pdf") {

            card.innerHTML = `
              <h2>
                <span class="resource-title-icon pdf"><i class="fa-solid fa-file-pdf"></i></span>
                ${resource.title}
              </h2>

              <a class="resource-link"
                 href="${resource.url}"
                 target="_blank">
                 Open PDF
              </a>
            `;

          } else if (resource.type === "doc") {

            card.innerHTML = `
              <h2>
                <span class="resource-title-icon doc"><i class="fa-solid fa-file-word"></i></span>
                ${resource.title}
              </h2>

              <a class="resource-link"
                 href="${resource.url}"
                 target="_blank">
                 Open Document
              </a>
            `;

          } else if (resource.type === "image") {

            card.innerHTML = `
              <h2>
                <span class="resource-title-icon image"><i class="fa-solid fa-image"></i></span>
                ${resource.title}
              </h2>

              <img
                class="resource-image"
                src="${resource.url}"
                alt="${resource.title}"
              >
            `;

          } else if (resource.type === "link") {

            card.innerHTML = `
              <h2>
                <span class="resource-title-icon link"><i class="fa-solid fa-link"></i></span>
                ${resource.title}
              </h2>

              <a class="website-link" href="${resource.url}" target="_blank">
                Open Website
              </a>
            `;

          } else {

            card.innerHTML = `
              <h2>
                <span class="resource-title-icon video-icon"><i class="fa-solid fa-play"></i></span>
                ${resource.title}
              </h2>

              <div class="video">
                <iframe
                  src="https://www.youtube.com/embed/${resource.id}"
                  title="${resource.title}"
                  allowfullscreen>
                </iframe>
              </div>
            `;
          }
          videoList.appendChild(card);
        });
      }

      hideAllScreens();

      document
        .getElementById("topic-screen")
        .classList.add("active");

      window.scrollTo(0, 0);
    }

    function buildHomeScreen() {
      const categoryGrid =
        document.getElementById("category-grid");

      categoryGrid.innerHTML = "";

      toolkitData.forEach(function (category, index) {
        const button = document.createElement("button");

        button.className = "category-card";

        button.innerHTML =
          '<span class="category-icon">' + category.icon + '</span>' +
          '<span class="category-name">' + category.name + '</span>';

        button.onclick = function () {
          showCategory(index);
        };

        categoryGrid.appendChild(button);
      });
    }

    buildHomeScreen();
  </script>
</body>
</html>
