<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Positioning</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.back-button {
    display: inline-block;
    margin-bottom: 20px;
    padding: 13px 20px;
    border-radius: 11px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

header {
    margin-bottom: 20px;
    padding: 22px;
    border-radius: 18px;
    background: #1e293b;
}

header h1 {
    margin: 0 0 8px;
    font-size: 38px;
}

header p {
    margin: 0;
    color: #cbd5e1;
    font-size: 18px;
}

.video-card {
    padding: 20px;
    border-radius: 18px;
    background: #1e293b;
}

.video-card h2 {
    margin-top: 0;
}

.video {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
}

.video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 13px;
}
</style>
</head>

<body>

<div class="container">

<a class="back-button" href="index.html">
    ← Back to ADI Toolkit
</a>

<header>
    <h1>Positioning</h1>
    <p>Videos explaining road position and vehicle positioning.</p>
</header>

<div class="video-card">

    <h2>Positioning demonstration</h2>

    <div class="video">
        <iframe
            src="https://www.youtube.com/embed/dR1ccDljtmM"
            title="Positioning demonstration"
            allowfullscreen>
        </iframe>
    </div>

</div>

</div>

</body>
</html>
